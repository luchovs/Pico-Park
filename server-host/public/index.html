<!doctype html>
<html>
  <head>
    <title>Pico Park Host</title>

    <style>
      body {
        margin: 0;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: sans-serif;
      }

      canvas {
        max-width: 100vw;
        max-height: 100vh;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      }

      #winOverlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0);

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        z-index: 100;
      }

      #winOverlay h1 {
        color: white;
        font-size: 60px;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 5px;
        text-align: center;

        display: flex;
        flex-direction: column;
      }

      #playerStatus {
        color: #aaa;
        margin-bottom: 30px;
        font-size: 20px;
      }

      #btnRestart {
        padding: 15px 40px;
        font-size: 24px;
        cursor: pointer;
        background: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        transition: transform 0.2s;
      }

      #btnRestart:hover:not(:disabled) {
        transform: scale(1.1);
        background: #ddd;
      }

      #btnRestart:disabled {
        background: #555;
        color: #888;
        cursor: not-allowed;
      }
    </style>
  </head>

  <body>

    <div id="winOverlay">

      <h1 id="overlayTitle">
        ESPERANDO JUGADORES
      </h1>

      <div id="playerStatus">
        Conectados: 0/4
      </div>

      <button id="btnRestart" disabled>
        EMPEZAR JUEGO
      </button>

    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <script>

      const socket = io();

      const engine = Matter.Engine.create();

      // DOM
      const overlay = document.getElementById("winOverlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const playerStatus = document.getElementById("playerStatus");
      const btnRestart = document.getElementById("btnRestart");

      const render = Matter.Render.create({
        element: document.body,
        engine: engine,

        options: {
          width: 1280,
          height: 720,
          wireframes: false,
          background: "#111",
        },
      });

      Matter.Render.run(render);

      render.options.hasBounds = true;

      const entityRenders = {};

      let currentEntities = [];

      let levelWon = false;

      // IMÁGENES
      const imgKey = new Image();
      imgKey.src = "/llave.png";

      const imgDoorClosed = new Image();
      imgDoorClosed.src = "/puerta_cerrada.png";

      const imgDoorOpen = new Image();
      imgDoorOpen.src = "/puerta_abierta.png";

      const DOOR_CONFIG = {

        closed: {
          width: 80,
          height: 140,
          offsetX: 50,
          offsetY: 94
        },

        open: {
          width: 105.7,
          height: 140,
          offsetX: 50,
          offsetY: 94
        }
      };

      // =========================
      // JUGADORES
      // =========================

      socket.on("playerCountUpdate", (data) => {

        playerStatus.innerText = `Conectados: ${data.count}/2`;

        if (!levelWon) {

          overlay.style.display = "flex";

          if (data.canStart) {

            btnRestart.disabled = false;

            overlayTitle.innerText = "¡LISTOS PARA JUGAR!";

            btnRestart.innerText = "EMPEZAR JUEGO";

          } else {

            btnRestart.disabled = true;

            overlayTitle.innerText = "ESPERANDO JUGADORES";
          }
        }
      });

      // =========================
      // BOTÓN START
      // =========================

      btnRestart.onclick = () => {

        overlay.style.display = "none";

        socket.emit("restart");
      };

      // =========================
      // RENDER
      // =========================

      Matter.Events.on(render, "afterRender", () => {

        const ctx = render.context;

        // =========================
        // SUELO
        // =========================

        const ground = currentEntities.find(
          e => e.type === "ground"
        );

        if (ground) {

          ctx.fillStyle = "#333";

          ctx.fillRect(
            ground.x - 640,
            ground.y - 30,
            1280,
            60
          );
        }

        // =========================
        // PLATAFORMAS
        // =========================

        currentEntities
          .filter(e => e.type === "platform")
          .forEach(plt => {

            ctx.fillStyle = plt.color || "#444";

            ctx.fillRect(
              plt.x - (plt.w / 2),
              plt.y - (plt.h / 2),
              plt.w,
              plt.h
            );
          });

        // =========================
        // PUERTA
        // =========================

        const door = currentEntities.find(
          e => e.type === "door"
        );

        if (door) {

          const config =
            door.isOpen
              ? DOOR_CONFIG.open
              : DOOR_CONFIG.closed;

          const img =
            door.isOpen
              ? imgDoorOpen
              : imgDoorClosed;

          if (img.complete) {

            ctx.drawImage(
              img,
              door.x - config.offsetX,
              door.y - config.offsetY,
              config.width,
              config.height
            );
          }
        }

        // =========================
        // LLAVE
        // =========================

        const keyEnt = currentEntities.find(
          e => e.type === "key"
        );

        if (keyEnt && imgKey.complete) {

          ctx.drawImage(
            imgKey,
            keyEnt.x - 25,
            keyEnt.y - 45,
            20,
            51.2
          );
        }

        // =========================
        // JUGADORES
        // =========================

        currentEntities
          .filter(e => e.type === "player")
          .forEach(p => {

            ctx.fillStyle = p.color;

            ctx.fillRect(
              p.x - 16,
              p.y - 24,
              32,
              48
            );

            ctx.strokeStyle = "black";

            ctx.strokeRect(
              p.x - 16,
              p.y - 24,
              32,
              48
            );

            // OJOS
            ctx.fillStyle = "white";

            let off =
              p.moveDir >= 0
                ? -6
                : -14;

            ctx.fillRect(
              p.x + off,
              p.y - 12,
              8,
              8
            );

            ctx.fillRect(
              p.x + off + 12,
              p.y - 12,
              8,
              8
            );

            ctx.fillStyle = "black";

            ctx.fillRect(
              p.x + off + (p.moveDir >= 0 ? 5 : 1),
              p.y - 10,
              3,
              3
            );

            ctx.fillRect(
              p.x + off + (p.moveDir >= 0 ? 17 : 13),
              p.y - 10,
              3,
              3
            );
          });
      });

      // =========================
      // UPDATE
      // =========================

      socket.on("stateUpdate", (data) => {

        currentEntities = data.entities;

        currentEntities.forEach((ent) => {

          if (!entityRenders[ent.id]) {

            const isPlatform =
              ent.type === "platform";

            const w =
              isPlatform
                ? ent.w
                : (ent.type === "ground" ? 1280 : 32);

            const h =
              isPlatform
                ? ent.h
                : (ent.type === "ground" ? 60 : 48);

            entityRenders[ent.id] =
              Matter.Bodies.rectangle(
                ent.x,
                ent.y,
                w,
                h,
                {
                  isStatic: true,

                  render: {
                    visible: false,
                    fillStyle: ent.color || "#555"
                  }
                }
              );

            Matter.Composite.add(
              engine.world,
              entityRenders[ent.id]
            );

          } else {

            Matter.Body.setPosition(
              entityRenders[ent.id],
              {
                x: ent.x,
                y: ent.y
              }
            );
          }
        });

        // =========================
        // WIN
        // =========================

        if (data.levelWon && !levelWon) {

          levelWon = true;

          overlay.style.display = "flex";

          if (data.currentLevel === 1) {

            overlayTitle.innerHTML =
              "¡NIVEL 1 COMPLETADO!";

            btnRestart.innerText =
              "SIGUIENTE NIVEL";

          } else if (data.currentLevel === 2) {

            overlayTitle.innerHTML =
              "¡NIVEL 2 COMPLETADO!<br><span style='font-size:40px;color:#00FF00;'>FIN DEL JUEGO</span>";

            btnRestart.innerText =
              "REINICIAR JUEGO";
          }

          btnRestart.disabled = false;

        } else if (!data.levelWon) {

          levelWon = false;
        }

        // =========================
        // LIMPIAR ENTIDADES VIEJAS
        // =========================

        const ids = currentEntities.map(
          e => e.id
        );

        Object.keys(entityRenders).forEach(id => {

          if (!ids.includes(id)) {

            Matter.Composite.remove(
              engine.world,
              entityRenders[id]
            );

            delete entityRenders[id];
          }
        });
      });

    </script>

  </body>
</html>
